name: Import prepared Neural App source
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify and unpack prepared release
        shell: python
        run: |
          from pathlib import Path, PurePosixPath
          import hashlib, json, zipfile, ast
          root = Path.cwd().resolve()
          manifest = json.loads((root / 'UPLOAD-CHECKSUMS.json').read_text())
          contents = {}
          for item in manifest['archives']:
              archive = root / item['name']
              if hashlib.sha256(archive.read_bytes()).hexdigest() != item['sha256']:
                  raise RuntimeError('Archive checksum mismatch: ' + item['name'])
              with zipfile.ZipFile(archive) as z:
                  for entry in z.infolist():
                      name = entry.filename
                      p = PurePosixPath(name)
                      if p.is_absolute() or '..' in p.parts or '.git' in p.parts or name in contents:
                          raise RuntimeError('Invalid or duplicate archive path')
                      if entry.is_dir():
                          continue
                      contents[name] = z.read(entry)
          if len(contents) != manifest['expected_file_count']:
              raise RuntimeError('Unexpected source file count')
          source_manifest = contents['SOURCE-MANIFEST.json']
          if hashlib.sha256(source_manifest).hexdigest() != manifest['source_manifest_sha256']:
              raise RuntimeError('Source manifest checksum mismatch')
          expected = json.loads(source_manifest)
          for item in expected:
              data = contents[item['path']]
              if hashlib.sha256(data).hexdigest() != item['sha256']:
                  raise RuntimeError('Source checksum mismatch: ' + item['path'])
          for name, data in contents.items():
              target = (root / name).resolve()
              if not target.is_relative_to(root):
                  raise RuntimeError('Path escaped repository')
              if name.endswith('.py'):
                  ast.parse(data.decode('utf-8-sig'), filename=name)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
          for item in manifest['archives']:
              (root / item['name']).unlink()
          (root / 'UPLOAD-CHECKSUMS.json').unlink()
          print('Verified and imported', len(contents), 'source files. App was not launched.')
      - name: Commit imported source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import verified Neural App source and remove upload archives"
          git push

