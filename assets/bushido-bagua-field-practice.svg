<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="t d"><title id="t">Bushido and Bagua: still centre, moving sphere</title><desc id="d">A practitioner makes a slow ceremonial bokken movement, the eight trigrams surround a still yin-yang and cross centre, and an Earth sphere represents a chosen distant focus. Arrows show inward attention and outward intention. Six phases connect purpose, centring, movement, perspectives, world concern and virtuous action.</desc><defs><linearGradient id="paper" x2="1" y2="1"><stop stop-color="#f8fbfc"/><stop offset="1" stop-color="#d6e1e8"/></linearGradient><radialGradient id="light"><stop stop-color="#ffffff" stop-opacity=".9"/><stop offset="1" stop-color="#97bfd4" stop-opacity="0"/></radialGradient><marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#6c94ad"/></marker></defs><style>.sweep{transform-origin:260px 396px;animation:sweep 12s ease-in-out infinite}.vortex{transform-origin:700px 350px;animation:orbit 50s linear infinite}.return{stroke-dasharray:5 12;animation:flow 8s linear infinite}.emanation{transform-origin:700px 350px;animation:shine 8s ease-in-out infinite}@keyframes sweep{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(11deg)}}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes flow{to{stroke-dashoffset:-170}}@keyframes shine{50%{opacity:.3;transform:scale(1.08)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="1400" height="900" rx="24" fill="url(#paper)"/><rect x="20" y="20" width="1360" height="860" rx="16" fill="none" stroke="#95adbc"/><g fill="#28495f" font-family="Arial" text-anchor="middle"><text x="700" y="65" font-size="28" letter-spacing="3">BUSHIDO × BAGUA</text><text x="700" y="99" font-size="16">VIRTUE · STILL CENTRE · CHANGING PERSPECTIVES · FAITHFUL LOVE</text></g><g fill="none" stroke="#a7bbc8"><rect x="45" y="145" width="370" height="445" rx="18"/><rect x="445" y="145" width="510" height="445" rx="18"/><rect x="985" y="145" width="370" height="445" rx="18"/></g>
