<!-- SIX PHASES -->
<g><rect x="45" y="625" width="205" height="99" rx="12" fill="#ecf2f6" stroke="#9db4c4"/><text x="147" y="656" fill="#335b73" font-family="Arial" text-anchor="middle" font-size="14">01 · PURPOSE</text><text x="147" y="685" fill="#45667b" font-family="Arial" text-anchor="middle" font-size="11">What good is served?</text></g><g><rect x="265" y="625" width="205" height="99" rx="12" fill="#ecf2f6" stroke="#9db4c4"/><text x="367" y="656" fill="#335b73" font-family="Arial" text-anchor="middle" font-size="14">02 · CENTRE</text><text x="367" y="685" fill="#45667b" font-family="Arial" text-anchor="middle" font-size="11">Gather and steady attention</text></g><g><rect x="485" y="625" width="205" height="99" rx="12" fill="#ecf2f6" stroke="#9db4c4"/><text x="587" y="656" fill="#335b73" font-family="Arial" text-anchor="middle" font-size="14">03 · TRACE</text><text x="587" y="685" fill="#45667b" font-family="Arial" text-anchor="middle" font-size="11">Slow chosen movement</text></g><g><rect x="705" y="625" width="205" height="99" rx="12" fill="#ecf2f6" stroke="#9db4c4"/><text x="807" y="656" fill="#335b73" font-family="Arial" text-anchor="middle" font-size="14">04 · PERSPECTIVES</text><text x="807" y="685" fill="#45667b" font-family="Arial" text-anchor="middle" font-size="11">Receive all eight images</text></g><g><rect x="925" y="625" width="205" height="99" rx="12" fill="#ecf2f6" stroke="#9db4c4"/><text x="1027" y="656" fill="#335b73" font-family="Arial" text-anchor="middle" font-size="14">05 · WORLD CONCERN</text><text x="1027" y="685" fill="#45667b" font-family="Arial" text-anchor="middle" font-size="11">Offer prayer and learn</text></g><g><rect x="1145" y="625" width="205" height="99" rx="12" fill="#ecf2f6" stroke="#9db4c4"/><text x="1247" y="656" fill="#335b73" font-family="Arial" text-anchor="middle" font-size="14">06 · VIRTUOUS ACT</text><text x="1247" y="685" fill="#45667b" font-family="Arial" text-anchor="middle" font-size="11">Choose, act and review</text></g><g fill="#36