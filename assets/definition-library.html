<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Shared definition library</title><style>body{font:17px system-ui;background:#edf1f4;color:#172632;max-width:1100px;margin:auto;padding:28px}article,header{background:white;border:1px solid #b5c4ce;border-radius:16px;padding:22px;margin:18px 0}input{padding:12px;width:90%;font:inherit}h2{color:#36566d}dt{font-weight:bold;margin-top:14px}dd{margin:6px 0;line-height:1.6}</style><header><h1>Souls over digits</h1><p>Shared definitions · four-way assessment · correction and outcome review</p><input id="search" placeholder="Filter infrastructure and corporate domains"></header><main id="content"></main><script>fetch('/assets/shared-ethics-library.json').then(r=>r.json()).then(l=>{const main=document.querySelector('main');function section(title,value){const a=document.createElement('article'),h=document.createElement('h2'),dl=document.createElement('dl');h.textContent=title;for(const [k,v] of Object.entries(value)){const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=k.replaceAll('_',' ');dd.textContent=typeof v==='object'?JSON.stringify(v):v;dl.append(dt,dd)}a.append(h,dl);return a}function draw(){main.replaceChildren(section('Intent and scope',{intent:l.spiritual_intent,scope:l.scope,priority:l.priority}),section('Definitions',l.categories),section('Hold / correct / verify',l.correction),section('Emergency protection',l.emergency));main.append(section('Source handling',l.source_policy));for(const source of l.source_records){const card=section(source.title,{summary:source.summary,application:source.application,type:source.type,reviewed:source.reviewed}),link=document.createElement('a');link.href=source.url;link.textContent='Read primary source';link.target='_blank';link.rel='noopener';card.append(link);main.append(card)}for(const d of l.domains)if(JSON.stringify(d).toLowerCase().includes(search.value.toLowerCase()))main.append(section(d.id,{purpose:d.purpose,...d.four_way,questions:d.questions.join(' • ')}))}search.oninput=draw;draw()})</script>
