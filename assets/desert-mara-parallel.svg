<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 325" role="img" aria-labelledby="title desc">
<title id="title">Temptation: two distinct traditions, a parallel of principled response</title>
<desc id="desc">Buddha and Mara on the left, Jesus in the wilderness on the right, connected by recognition, discernment and constructive conduct. An inward and outward feedback loop runs underneath.</desc>
