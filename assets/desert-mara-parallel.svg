</g><g fill="#e3edf3" font-family="Arial,sans-serif" text-anchor="middle"><text x="215" y="48" font-size="18">BUDDHA · MĀRA</text><text x="685" y="48" font-size="18">JESUS · WILDERNESS</text><text x="450" y="120" font-size="12">RECOGNISE</text><text x="450" y="138" font-size="12">CHOOSE</text><text x="215" y="230" font-size="13">Release craving · refuse pride</text><text x="685" y="230" font-size="13">Refuse spectacle · refuse domination</text><text x="450" y="268" font-size="12">INWARD ATTENTION ↔ OUTWARD CONDUCT ↔ FEEDBACK</text><text x="450" y="296" font-size="11" fill="#a6c4d5">Distinct teachings · shared inquiry into fidelity under pressure</text></g></svg>
