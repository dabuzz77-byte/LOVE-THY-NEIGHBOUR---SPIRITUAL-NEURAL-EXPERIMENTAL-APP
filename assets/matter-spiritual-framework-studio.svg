<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
 <title id="title">God, matter, action and opposition</title>
 <desc id="desc">A visual redraw of the supplied diagram, retaining its labels and relationships: God (reality), sinless eternal nonaction, Heaven, Matter, the world of action, choice, free will, Sea of One (Many but One), Anti Matter, Satan (scapegoat), and the downward arrow to God’s Hatred of karma.</desc>
 <defs>
  <linearGradient id="paper" x2="1" y2="1"><stop stop-color="#26343b"/><stop offset=".5" stop-color="#202a30"/><stop offset="1" stop-color="#292d32"/></linearGradient>
  <radialGradient id="sphere" cx="35%" cy="28%" r="80%"><stop stop-color="#b7d1d5" stop-opacity=".11"/><stop offset=".75" stop-color="#8ba6b2" stop-opacity=".025"/><stop offset="1" stop-color="#12232c" stop-opacity=".16"/></radialGradient>
  <linearGradient id="line" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1600" y2="0"><stop stop-color="#afc9ce"/><stop offset="1" stop-color="#8795a9"/></linearGradient>
  <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth"><path d="M1 1 L9 5.5 L1 10" fill="none" stroke="#b8c8d0" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker>
 </defs>
 <rect width="1600" height="900" rx="22" fill="url(#paper)"/>
 <rect x="17" y="17" width="1566" height="866" rx="14" fill="none" stroke="#b1c3c8" stroke-opacity=".18"/>
 <g fill="none" stroke="#9aafb5" stroke-width="1" opacity=".6">
  <path d="M37 70V38H70 M1530 38H1563V70 M37 830V862H70 M1530 862H1563V830"/>
  <path d="M47 61V48H61 M1539 48H1553V61 M47 839V852H61 M1539 852H1553V839" opacity=".45"/>
 </g>
 <g fill="none" stroke="url(#line)" stroke-width="2.2" stroke-linecap="round">
  <path d="M481 117 A385 385 0 0 0 481 783" opacity=".7"/>
  <path d="M514 162 A333 333 0 0 0 514 738" opacity=".8"/>
  <path d="M648 151 A300 300 0 0 0 648 749" opacity=".9"/>
  <circle cx="650" cy="450" r="272" fill="url(#sphere)" stroke-width="2.5"/>
 </g>
 <g fill="#d9e4e6" font-family="'Segoe UI',Arial,sans-serif" font-weight="300" text-anchor="middle">
  <text transform="translate(121 450) rotate(-90)" font-size="35" letter-spacing=".5">GOD (reality)</text>
  <text transform="translate(165 450) rotate(-90)" font-size="28">sinless eternal</text>
  <text transform="translate(207 450) rotate(-90)" font-size="28">nonaction</text>
  <text transform="translate(251 450) rotate(-90)" font-size="28" letter-spacing="4">HEAVEN</text>
  <text transform="translate(324 450) rotate(-90)" font-size="27" letter-spacing="4" fill="#a8c6d0">MATTER</text>
  <g fill="#eef1eb" font-size="38">
   <text x="650" y="350">World of action</text>
   <text x="650" y="408">Choice</text>
   <text x="650" y="466">Free Will</text>
   <text x="650" y="533" font-size="34">[Sea of One(Many</text>
   <text x="650" y="583" font-size="34">but One)]</text>
  </g>
 </g>
 <g fill="none" stroke="url(#line)" stroke-width="2.4" stroke-linecap="round">
  <path d="M922 450H1150 M1183 450H1513"/>
  <path d="M1348 546V665" marker-end="url(#arrow)"/>
 </g>
 <g font-family="'Segoe UI',Arial,sans-serif" font-weight="300" fill="#e0e5eb" text-anchor="middle">
  <text x="1035" y="505" font-size="34">Anti</text>
  <text x="1035" y="551" font-size="34">Matter</text>
  <text x="1348" y="420" font-size="38">Satan</text>
  <text x="1348" y="508" font-size="33">[scapegoat]</text>
  <text x="1348" y="726" font-size="34">God’s Hatred</text>
  <text x="1348" y="776" font-size="34">of karma</text>
 </g>
</svg>
