<!doctype html><meta charset="utf-8"><title>Modulator defaults verification</title><style>body{font:15px/1.5 Segoe UI;background:#edf2f5;padding:20px;color:#183248}.panel{background:white;border:1px solid #b1c0ca;padding:20px;border-radius:16px;margin:18px 0}.actions{display:flex;gap:12px;flex-wrap:wrap}textarea{box-sizing:border-box}canvas{max-height:170px}pre{max-height:200px;overflow:auto}</style><h1>Modulator defaults · live verification</h1><pre id="summary"></pre><main id="root"></main><script type="module">
import {mountWaveRouting} from './wave_routing.js';import {mountCmbModulator,mountNoiseModulator} from './ambient_extra_modulators.js';import{mountAmbientFluxIO}from'./ambient_flux_io.js';
const page=await(await fetch('/')).text(),token=page.match(/NEURAL_TOKEN='([^']+)'/)[1],api=async(path,body)=>{const r=await fetch('/api/'+path,{method:body?'POST':'GET',headers:{'X-Neural-Token':token,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const v=await r.json();if(v.error)throw Error(v.error);return v;},root=document.querySelector('#root'),frames=new Map(),onFrame=v=>{frames.set(v.id,{id:v.id,enabled:v.enabled,routes:v.routes?.length,mix_gain:v.mix_gain,rms:v.rms});document.querySelector('#summary').textContent=JSON.stringify([...frames.values()],null,2);};mountAmbientFluxIO(root,()=>({ambient:'verification source'}),api);mountWaveRouting(root,api,onFrame);mountWaveRouting(root,api,onFrame,{chant:true});for(const kind of ['dolphin','whale','cat','dog','bird','ice','rain','beach'])mountWaveRouting(root,api,onFrame,{kind});mountCmbModulator(root,onFrame);mountNoiseModulator(root,onFrame);
</script>
