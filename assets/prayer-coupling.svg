<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 325" role="img" aria-labelledby="t d"><title id="t">Prayer: projection, reception, induction and displacement</title><desc id="d">A centred person within three spheres. Arrows extend outward and return inward. Induction evokes a response, displacement changes a pattern and restoration re-establishes it. The whole image is labelled as the author's spiritual teaching.</desc>
