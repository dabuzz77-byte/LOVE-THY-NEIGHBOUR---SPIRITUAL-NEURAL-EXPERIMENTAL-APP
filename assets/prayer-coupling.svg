<g fill="#e3edf2" font-family="Arial,sans-serif" text-anchor="middle"><text x="450" y="36" font-size="13" letter-spacing="2">PRAYER · HONOUR · RESPONSIBILITY</text><text x="616" y="85" font-size="11">PROJECTION →</text><text x="286" y="85" font-size="11">← EXPRESSION</text><text x="606" y="228" font-size="11">← RECEPTION</text><text x="287" y="228" font-size="11">RETURN →</text><text x="117" y="146" font-size="13">INDUCTION</text><text x="117" y="164" font-size="10">evoke a response</text><text x="782" y="140" font-size="12">DISPLACEMENT</text><text x="782" y="158" font-size="10">change a pattern</text><text x="782" y="180" font-size="11">RESTORATION</text><text x="450" y="268" font-size="16">“Thy will be done” · power placed in service</text><text x="450" y="292" font-size="11" fill="#a5bfcc">Author’s spiritual teaching · physics and Jedi imagery used as comparisons</text></g></svg>
