</g><g fill="#dce8ef" font-family="Arial,Segoe UI Symbol,sans-serif" text-anchor="middle"><text x="550" y="47" font-size="17" letter-spacing="3">PRAYER · DIRECTION · OFFERED GUIDANCE</text><text x="120" y="76" font-size="12">FAJR · DAWN</text><text x="330" y="76" font-size="12">DHUHR · MIDDAY</text><text x="550" y="76" font-size="12">ASR · AFTERNOON</text><text x="770" y="76" font-size="12">MAGHRIB · SUNSET</text><text x="980" y="76" font-size="12">ISHA · NIGHT</text><text x="395" y="125" font-size="14">QIBLA · TOWARD THE KAABA</text><text x="395" y="329" font-size="11">God is addressed in worship; the cube marks direction.</text><text x="395" y="421" font-size="12">Five obligatory daily prayers · individual observance varies</text><text x="873" y="239" font-size="24">✡  ☪  ॐ  ☸  ☬  ☯</text><text x="873" y="386" font-size="12">AN OFFERED PRAYER</text><text x="873" y="406" font-size="11">Truth · peace · protection · mercy</text><text x="550" y="467" font-size="12">Bread of Life · the vulnerable cherished · dignity for all beings</text><text x="550" y="487" font-size="9" fill="#9eb7c6">Islamic practice and the author’s Christian-led composition are presented distinctly.</text></g></svg>
