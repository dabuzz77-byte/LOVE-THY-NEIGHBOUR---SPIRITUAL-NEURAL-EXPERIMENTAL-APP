<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc"><title id="title">Cosmos · star core · Earth core · human centre</title><desc id="desc">Original spiritual framework diagram with nested cosmic orbits, cross sections of a star and Earth, and a centred human figure. Bidirectional arrows represent the author’s contemplative connections, not measured signals.</desc><defs><radialGradient id="space"><stop stop-color="#edf4f8"/><stop offset="1" stop-color="#9eb8c9"/></radialGradient><radialGradient id="core"><stop stop-color="#fff"/><stop offset=".55" stop-color="#e9f3f9"/><stop offset="1" stop-color="#7babc8"/></radialGradient><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#517b94"/></marker></defs><style>.orbit{stroke-dasharray:5 12;animation:o 35s linear infinite}@keyframes o{to{stroke-dashoffset:340}}@media(prefers-reduced-motion:reduce){.orbit{animation:none}}</style><rect width="1200" height="480" rx="20" fill="url(#space)"/><g fill="none" stroke="#64889d" opacity=".5"><ellipse cx="600" cy="245" rx="575" ry="190"/><ellipse class="orbit" cx="600" cy="245" rx="550" ry="155"/><ellipse cx="600" cy="245" rx="490" ry="110"/></g><g fill="#f6fbff"><circle cx="110" cy="105" r="2"/><circle cx="390" cy="80" r="3"/><circle cx="780" cy="105" r="2"/><circle cx="1080" cy="140" r="3"/><circle cx="650" cy="420" r="2"/><circle cx="280" cy="365" r="3"/></g><g stroke="#52768e" fill="none"><circle cx="220" cy="240" r="102" fill="#d5e5ef"/><circle cx="220" cy="240" r="77"/><circle cx="220" cy="240" r="51"/><circle cx="220" cy="240" r="28" fill="url(#core)"/><path d="M230 240h132"/><circle cx="600" cy="240" r="96" fill="#c7dce8"/><circle cx="600" cy="240" r="75"/><circle cx="600" cy="240" r="50"/><circle cx="600" cy="240" r="25" fill="url(#core)"/><path d="M540 178q35 27 20 45t30 20m50-85q-25 30-8 45t-8 36m-60 35q-20 25 10 43" stroke-width="6" opacity=".5"/><circle cx="970" cy="240" r="98" fill="#e7eff4"/><circle cx="970" cy="202" r="20"/><path d="M945 235q25-15 50 0l15 47-40 25-40-25zM945 245l-44 40 42 8m52-48 44 40-42 8m-54 0-28 25h110l-28-25" stroke-width="3"/><circle cx="970" cy="250" r="11" fill="url(#core)"/><path d="M340 240h145M710 240h140" marker-start="url(#arrow)" marker-end="url(#arrow)" stroke-width="2"/></g><g fill="#29495f" font-family="sans-serif" text-anchor="middle"><text x="600" y="37" font-size="21" letter-spacing="4">COSMOS · CONNECTION · INTENTION</text><text x="220" y="112" font-size="18">STAR</text><text x="220" y="370" font-size="15">Core → surrounding layers</text><text x="600" y="112" font-size="18">EARTH</text><text x="600" y="370" font-size="15">Core → living world</text><text x="970" y="112" font-size="18">HUMAN CENTRE</text><text x="970" y="370" font-size="15">Seek truth · embody good</text><text x="600" y="454" font-size="14">Author’s spiritual framework · the wider cosmos surrounds every local perspective</text></g></svg>
