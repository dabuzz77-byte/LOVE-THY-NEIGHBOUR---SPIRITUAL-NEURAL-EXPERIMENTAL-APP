<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc"><title id="title">A path through the white clouds</title><desc id="desc">Original animated mountain landscape, monastery and reflective water, with a path leading from listening to learning.</desc><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#d7e8ef"/><stop offset="1" stop-color="#fafbfc"/></linearGradient><linearGradient id="water" x2="0" y2="1"><stop stop-color="#90bacb"/><stop offset="1" stop-color="#e6eef2"/></linearGradient></defs><style>.cloud{animation:drift 28s ease-in-out infinite alternate}.ripple{animation:ripple 5s ease-out infinite;transform-origin:600px 380px}@keyframes drift{to{transform:translateX(45px)}}@keyframes ripple{from{opacity:.8;transform:scale(.4)}to{opacity:0;transform:scale(1.6)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><path fill="url(#sky)" d="M0 0h1200v500H0z"/><circle cx="930" cy="90" r="46" fill="#fff"/><path d="M0 310 180 90 320 290 500 60 710 290 880 130 1200 320V500H0" fill="#a9bac4"/><path d="m180 90-62 77 62-20 47 14zm320-30-94 124 94-45 90 42zm380 70-60 71 60-17 58 28z" fill="#fff"/><path d="M0 350Q220 260 400 350T800 335T1200 350V500H0" fill="#647d89"/><path d="M470 325Q850 380 500 435T640 500H850Q500 442 770 405T600 325" fill="url(#water)"/><g class="cloud" fill="white" opacity=".65"><ellipse cx="220" cy="205" rx="200" ry="18"/><ellipse cx="830" cy="243" rx="290" ry="20"/></g><g fill="#e5e6df" stroke="#344c5b" stroke-width="2"><path d="M170 355v-75h150v75z"/><path d="m150 280 95-32 95 32z" fill="#485d6b"/><path d="M230 355v-43h30v43" fill="#485d6b"/><path d="M190 301h18v18h-18zm92 0h18v18h-18z"/></g><path d="M245 355Q190 400 350 410T400 480" fill="none" stroke="#e8e7df" stroke-width="12"/><g fill="none" stroke="#e9f8ff"><ellipse class="ripple" cx="600" cy="380" rx="80" ry="10"/><ellipse class="ripple" style="animation-delay:2s" cx="600" cy="380" rx="80" ry="10"/></g><g font-family="sans-serif" fill="#203b4b"><text x="55" y="60" font-size="20" letter-spacing="5">TIBET · THE PATH TO WISDOM</text><text x="55" y="94" font-size="15">Listen deeply · honour the journey · let love become action</text></g><g font-family="sans-serif" font-size="14" fill="white" text-anchor="middle"><text x="135" y="470">LISTEN</text><text x="360" y="470">REFLECT</text><text x="850" y="470">CHOOSE</text><text x="1070" y="470">LEARN</text></g></svg>