<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="t d"><title id="t">From monetary critique to accountable provision</title><desc id="d">Four connected study stages surround a shared centre of living needs. Animated dots illustrate the study sequence, not external transmission.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#eaf0f3"/><stop offset="1" stop-color="#b6cbd5"/></linearGradient></defs><style>.flow{stroke-dasharray:8 12;animation:f 10s linear infinite}@keyframes f{to{stroke-dashoffset:-200}}@media(prefers-reduced-motion:reduce){.flow{animation:none}}</style><rect width="1200" height="420" rx="18" fill="url(#bg)"/><g fill="none" stroke="#7095a8"><ellipse cx="600" cy="220" rx="164" ry="130"/><ellipse cx="600" cy="220" rx="60" ry="130"/><path d="M438 220h324M465 155h270M465 285h270"/><path class="flow" d="M280 110 470 175M730 175 920 110M280 330 470 270M730 270 920 330" stroke-width="3"/></g><g fill="#f8fafb" stroke="#7895a5"><rect x="35" y="55" width="245" height="100" rx="14"/><rect x="920" y="55" width="245" height="100" rx="14"/><rect x="35" y="270" width="245" height="100" rx="14"/><rect x="920" y="270" width="245" height="100" rx="14"/><circle cx="600" cy="220" r="86"/></g><g font-family="sans-serif" text-anchor="middle" fill="#223e50"><text x="600" y="38" font-size="20" letter-spacing="3">ZEITGEIST: ADDENDUM · STUDY MAP</text><text x="157" y="92" font-size="19">I · MONEY</text><text x="157" y="122" font-size="14">Creation · debt · distribution</text><text x="1042" y="92" font-size="19">II · POWER</text><text x="1042" y="122" font-size="14">Contracts · influence · sovereignty</text><text x="157" y="307" font-size="19">III · RESOURCES</text><text x="157" y="337" font-size="14">Provision · technology · ecology</text><text x="1042" y="307" font-size="19">IV · CHANGE</text><text x="1042" y="337" font-size="14">Knowledge · connection · action</text><text x="600" y="203" font-size="18">LIVING NEEDS</text><text x="600" y="230" font-size="14">Dignity · access</text><text x="600" y="254" font-size="14">Accountable outcomes</text><text x="600" y="397" font-size="14">UNDERSTAND → CHECK → FOUR-WAY REVIEW → PILOT → LEARN</text></g></svg>
